<!DOCTYPE html>
<html>
<head>
    <title>Enter Question</title>
    <style>
        body {
            background-color: #c9d6ff;
            background: linear-gradient(to right, #e2e2e2, rgb(131, 219, 219));
            font-family: 'Poppins', sans-serif;
        }
        .form-container {
            background: linear-gradient(to right, #e2e2e2, rgb(98, 196, 196));
            margin: 140px auto;
            width: 420px;
            padding: 20px;
            height: 500px;
            text-align: center;
            justify-content: center;
            align-items: center;
            background-color: white;
            box-shadow: 0px 20px 35px rgba(0, 0, 1, 0.9);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            font-weight: bolder;
        }
        form {
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 12px;
        }
        form input[type="text"]:focus {
            border-color: #0071f2;
            outline: none; /* optional, to remove the default outline */
        }
        form input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        input[type="submit"] {
            padding: 10px;
            border-radius: 12px;
            background: rgb(47, 180, 180);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.3s;
        }
        input[type="submit"]:hover {
            background: #07001f;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Enter Questions for {{ test_name }}</h1>
        <p>Questions that are entered must be more than "Number of Questions" fixed in the Test</p>
        <form action="{{ url_for('submit_question', test_id =test_id) }}" method="post">
            <label for="question">Question:</label>
            <input type="text" id="question" name="question" required><br>
            <label for="option1">Option 1:</label>
            <input type="text" id="option1" name="option1" required><br>
            <label for="option2">Option 2:</label>
            <input type="text" id="option2" name="option2" required><br>
            <label for="option3">Option 3:</label>
            <input type="text" id="option3" name="option3" required><br>
            <label for="option4">Option 4:</label>
            <input type="text" id="option4" name="option4" required><br><br>
            <label for="correct_option">Correct Option:</label>
            <select id="correct_option" name="correct_option" required>
                <option value="option1">Option 1</option>
                <option value="option2">Option 2</option>
                <option value="option3">Option 3</option>
                <option value="option4">Option 4</option>
            </select><br><br>
            <label for="tag">Tag:</label>
            <input type="text" id="tag" name="tag" required><br>
            <div class="button-container">
                <input type="submit" value="Submit Question">
            </div>
        </form>
        <div class="button-container">
            <form action="{{ url_for('finish') }}" method="post">
                <input type="submit" value="Finish">
            </form>
        </div>
    </div>
</body>
</html>

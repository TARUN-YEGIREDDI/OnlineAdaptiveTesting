<!DOCTYPE html>
<html>
<head>
    <title>Quiz-App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app" data-subject-name="{{ subject_name }}">
        <h1><center>Quiz</center></h1>
        <div class="quiz">
            <div id="question-number"></div>
            <h2 id="question">Question goes here</h2>
            <div id="tag">Tag</div>
            <div id="answer-buttons" class="btn-container">
                <button class="btn">Answer1</button>
                <button class="btn">Answer2</button>
                <button class="btn">Answer3</button>
                <button class="btn">Answer4</button>
            </div>
            <button id="next-btn" class="next-btn">Next</button>
        </div>
        <div id="score-container" class="hidden">
            <h2 id="score-text">Your Score: </h2>
            <button id="play-again-btn" class="next-btn">Re-Write</button>
            <button id = "performance" class="next-btn"> Performance </button>
        </div>
        <img id="performance-graph" class="hidden" />
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>

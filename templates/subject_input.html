 <!DOCTYPE html>
 <html>
 <head>
     <title>Enter Subject</title>
     <style>
         body
         {
             background-color: #405D72;
         }
         .cont
         {
             width:300px;
             height: 200px;
             text-align: center;
             padding: 10px;
             border-radius: 10px;
             margin: auto;
             margin-top: 200px;
             justify-content: center;
             background-color: white;
             box-shadow:0px 20px 35px rgba(0,0,1,0.9);
         }
          
         button
         {
             border-radius: 5px;
         }
     </style>
 </head>
 <body>
     <div class="cont">
         <h1>Enter Subject Name</h1>
         <form action="{{ url_for('student_quiz') }}" method="post">
            <select name="subject_name" id="subject">
                <option value="" disabled selected>Select your subject</option>
                <option value="mathematics">Mathematics</option>
                <option value="science">Science</option>
                <option value="history">History</option>
                <option value="english">English</option>
                <option value="geography">Geography</option>
                <option value="ques">Ques</option>
                <!-- Add more subjects as needed -->
            </select><br>
             <br><button type="submit">Start Quiz</button>
         </form>
     </div>
     
 </body>
 </html>

 <!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>select subject</title>
     <style>     
        body {
            background-color: #c9d6ff;
            background: linear-gradient(to right, #e2e2e2, rgb(131, 219, 219));
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .formclass {
            background: linear-gradient(to right, #e2e2e2, rgb(98, 196, 196));
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            background-color: #F5F5F5;
            box-shadow: 0px 20px 35px rgba(0, 0, 1, 0.9);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .inner-inputs {
            display: grid;
            grid-template-columns: auto auto auto;
            align-content: center;
            gap: 10px;
            margin-top:30px;
            margin-bottom: 30px;
        }
        .inner-inputs input{
            width :100%;
            height: 20px;
        }
        .inner-inputs input:focus{
            border-color: #1c7deb;
            outline: none;
        }
        button {
            padding: 10px 20px;
            border-radius: 5px;
            background: rgb(47, 180, 180);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background: #07001f;
            border: 2px solid #0f1048;
            transform: scale(1.05);
        }     
    </style>
 </head>
 <body>
